[project]
name = "sol-trade"
version = "2.0.0"
description = "A Solana trading bot with lots of features."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt==4.5.71",
    "httpx==0.28.1",
    "pandas==3.0.5",
    "prompt-toolkit==3.0.53",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "solana==0.40.1",
    "solders==0.28.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = [
    "-v",
    "--strict-markers",
]
