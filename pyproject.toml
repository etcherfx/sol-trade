[project]
name = "sol-trade"
version = "3.0.0"
description = "A Solana trading bot that runs your strategies and swaps through Jupiter."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt==4.5.89",
    "defusedxml>=0.7.1",
    "httpx==0.28.1",
    "pandas==3.1.0",
    "prompt-toolkit==3.0.53",
    "python-dotenv==1.2.4",
    "solana==0.41.0",
    "solders==0.29.0",
    "vadersentiment>=3.3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = [
    "-v",
    "--strict-markers",
]
